# Tianjun Engine minimal runnable configuration.
# Copy this file to ./tianjun.toml or set TIANJUN_CONFIG=/path/to/tianjun.toml.
# Advanced production and executor settings are documented in docs/security-boundary.md.

[server]
host = "127.0.0.1"
port = 8024
heartbeat_timeout_seconds = 15
lease_timeout_seconds = 60
lifecycle_sweep_interval_seconds = 1
policy_update_interval = 2
state_db = "${TIANJUN_STATE_DIR}/tianjun-state.sqlite"

[model]
dir = "${TIANJUN_HOME}/data/trained_models"
require = false

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
api_key_secret = "llm.api_key"
secrets_file = "${TIANJUN_CONFIG_DIR}/secrets.toml"
timeout_seconds = 30
temperature = 0.2
max_tokens = 700
required = true
offline = false

[chat]
require_llm = true
scenario = ""

[mcp]
base_url = "http://127.0.0.1:8024"
transport = "stdio"

[runtime_demo]
max_rounds = 40

[agent]
server = "http://127.0.0.1:8024"
max_cycles = 30
poll_interval_seconds = 1.0

[real_agent]
server = "http://127.0.0.1:8024"
node_config = "${TIANJUN_HOME}/examples/real_node_agent.example.json"
once = false
execute = false

[security]
require_commit_confirmation = true
allow_process_executor = false
allow_docker_executor = false
allow_kubernetes_executor = false
