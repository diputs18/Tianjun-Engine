<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tianjun Engine Dashboard</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("tianjun:theme") || "light";
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = mode === "system" ? (systemDark ? "dark" : "light") : mode;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeMode = mode;
          document.documentElement.style.colorScheme = theme;
          document.body && document.body.setAttribute("arco-theme", theme === "dark" ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
