<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天钧引擎 - 算力网络调度驾驶舱</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/overview.css">
  <link rel="stylesheet" href="css/pages/scheduling.css">
  <link rel="stylesheet" href="css/pages/topology.css">
  <link rel="stylesheet" href="css/pages/tasks.css">
  <link rel="stylesheet" href="css/pages/model.css">
</head>
<body>
  <nav class="topnav">
    <span class="topnav-brand">天钧引擎</span>
    <div class="topnav-tabs" role="tablist" aria-label="主功能页面">
      <button id="tab-overview" class="tab-btn active" data-page="overview" role="tab" aria-selected="true" aria-controls="page-overview"><span aria-hidden="true">⌁</span>总览</button>
      <button id="tab-scheduling" class="tab-btn" data-page="scheduling" role="tab" aria-selected="false" aria-controls="page-scheduling" tabindex="-1"><span aria-hidden="true">◇</span>调度决策</button>
      <button id="tab-topology" class="tab-btn" data-page="topology" role="tab" aria-selected="false" aria-controls="page-topology" tabindex="-1"><span aria-hidden="true">◎</span>网络拓扑</button>
      <button id="tab-tasks" class="tab-btn" data-page="tasks" role="tab" aria-selected="false" aria-controls="page-tasks" tabindex="-1"><span aria-hidden="true">▣</span>任务执行</button>
      <button id="tab-model" class="tab-btn" data-page="model" role="tab" aria-selected="false" aria-controls="page-model" tabindex="-1"><span aria-hidden="true">△</span>模型配置</button>
    </div>
    <div class="topnav-status" aria-live="polite">
      <span class="status-dot" id="statusDot"></span>
      <span id="systemStatus" class="badge badge-neutral">系统检查中</span>
      <span id="modelStatus" class="badge badge-neutral">模型检查中</span>
      <span id="hermesLlmStatus" class="badge badge-neutral">Hermes 检查中</span>
      <span id="mcpStatus" class="badge badge-neutral">MCP 等待工具调用</span>
      <span id="autoRefreshStatus" class="badge badge-primary">自动刷新中</span>
      <span id="lastSync" class="topnav-clock">--:--:--</span>
      <button class="btn-ghost btn-sm" id="refreshButton" type="button">刷新</button>
    </div>
  </nav>
  <div id="alertBanner" class="alert-banner" hidden></div>
  <main id="app">
    <div class="page" id="page-overview" role="tabpanel" aria-labelledby="tab-overview"></div>
    <div class="page" id="page-scheduling" role="tabpanel" aria-labelledby="tab-scheduling" hidden></div>
    <div class="page" id="page-topology" role="tabpanel" aria-labelledby="tab-topology" hidden></div>
    <div class="page" id="page-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden></div>
    <div class="page" id="page-model" role="tabpanel" aria-labelledby="tab-model" hidden></div>
  </main>
  <script type="module" src="js/router.js"></script>
</body>
</html>
